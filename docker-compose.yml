services:
  postgres:
    image: postgres:17-alpine
    environment:
      {
        POSTGRES_USER: workflow,
        POSTGRES_PASSWORD: workflow,
        POSTGRES_DB: workflow,
      }
    ports: ["5434:5432"]
    healthcheck:
      {
        test: ["CMD-SHELL", "pg_isready -U workflow"],
        interval: 5s,
        timeout: 3s,
        retries: 10,
      }
  redis:
    image: redis:8-alpine
    ports: ["6380:6379"]
  mongodb:
    image: mongo:8
    ports: ["27018:27017"]
